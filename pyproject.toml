[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swda"
version = "0.0.1"
description = "Clean, quality-check and prepare solar wind data for statistical and machine-learning analysis."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jibin V. Sunny", email = "jibinvsunny@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]
parquet = ["pyarrow>=14"]

[project.scripts]
swda = "swda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
